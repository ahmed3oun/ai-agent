services:
  pg_db:
    image: pgvector/pgvector:pg16
    container_name: ai_agent_db_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent_db}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_agent_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      app_network:
        aliases:
          - pg_db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pg_db:5432/ai_agent_db?schema=public
      PORT: 4000
    depends_on:
      pg_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: web
    ports:
      - "3000:3000"
    env_file:
      - ./apps/web/.env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: